# ค่า tunable — mirror โครงสร้างโฟลเดอร์ (_appliesTo ระบุ feature) · arc42 §8.7
# คำอธิบายเต็ม: docs/CONFIG.md · Loader จุดเดียว: src/shared/config/ (zod validate, แก้แล้ว restart)

[app]
name = "uni-backend"
debug = true                        # ยังไม่มี consumer

[auth]                              # src/features/auth/
_appliesTo = ["src/features/auth/"]
accessTokenTtlMinutes = 15          # อายุ access token (นาที) — หมดอายุ FE ต้อง refresh (flow #15)
refreshTokenTtlDays = 14            # อายุ refresh token (วัน)

[auth.argon2]                       # ADR-0029 — OWASP minimum
memoryCostKiB = 19456               # 19 MiB
timeCost = 2
parallelism = 1

[files]                             # src/features/files/
_appliesTo = ["src/features/files/"]
maxFileSizeMb = 25                  # เกิน → 400 (docx FE ≤ 20MB กันเหลื่อม)
storagePath = "data/files"

[files.rag]                         # ADR-0025 — chunk/embed/semantic search
chunkTargetTokens = 450
chunkOverlapPercent = 10            # 0 = ไม่ทับซ้อน
chunkTableMaxTokens = 4096          # เกิน → ตารางแตก part i/n (Rev 2, D7)
topK = 5
embeddingModel = "onnx-community/Qwen3-Embedding-0.6B-ONNX" # ADR-0031, 1024 dims; เปลี่ยนรุ่น = re-embed ทุกไฟล์
embeddingMaxTokens = 1024           # cap tokenizer — RAM น้อย = ลดค่านี้
formFastPath = true                 # SPEC ff2569 — false = generic path เสมอ
vlmModel = "qwen/qwen3-vl-30b-a3b-instruct" # caption รูปตอน fast path; "" = ปิด

[ai]                                # src/features/ai/
_appliesTo = ["src/features/ai/"]
mock = false                        # true = MockAiClient, ไม่ใช้ OPENROUTER_KEY (TC-6)

[ai.models]                         # slug "vendor/model" — ต้อง tool calling; action ไม่มีในตารางใช้ default
default = "google/gemini-2.5-flash"
analyze_proposal = "google/gemini-2.5-flash" # อ่าน proposal เต็มเล่ม แพงสุด — คุ้มใช้รุ่นแข็ง
chat = "google/gemini-2.5-flash"

[notifications]                     # src/features/notifications/
_appliesTo = ["src/features/notifications/"]
# (ยังไม่มี tunable — SSE/polling ตาม ADR-0024, ไม่มี SMTP จริงใน v1)
