<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DMP lifecycle · State machine</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#bf4520; --font-sans:'Geist',system-ui,sans-serif; --font-serif:'Instrument Serif',serif; --font-mono:'Geist Mono',ui-monospace,monospace; }
    body { font-family:var(--font-sans); background:var(--color-paper); color:var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1200px; width:100%; overflow-x:auto; }
    .eyebrow { font-family:var(--font-mono); font-size:0.66rem; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:0.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem,2.4vw + 0.75rem,2rem); font-weight:400; letter-spacing:-0.02em; line-height:1.15; color:var(--color-ink); margin-bottom:1.5rem; }
    svg { width:100%; min-width:1000px; display:block; }
    svg text { font-family:'Geist',sans-serif; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State · Lifecycle phase map · src/features/dmps</p>
    <h1>Research data management plan lifecycle</h1>

    <svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dmp-lifecycle-title dmp-lifecycle-desc">
      <title id="dmp-lifecycle-title">DMP lifecycle: draft → pending → approved → archived</title>
      <desc id="dmp-lifecycle-desc">A lifecycle phase map of a data management plan: Draft, Pending committee review, and Approved in force on the primary rail, with reject/discard return paths, minor edits and revision loops, and a terminal Archived state.</desc>
      <defs>
        <pattern id="dmp-lifecycle-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
        <marker id="dmp-lifecycle-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
        <marker id="dmp-lifecycle-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bf4520"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dmp-lifecycle-dots)" opacity="0.55"/>

      <!-- Bands: interruption/recovery (top), terminal outcomes (bottom). -->
      <rect x="24" y="44" width="952" height="120" rx="8" fill="rgba(79,93,117,0.035)" stroke="rgba(45,49,66,0.12)"/>
      <rect x="24" y="400" width="952" height="104" rx="8" fill="rgba(45,49,66,0.035)" stroke="rgba(45,49,66,0.12)"/>
      <text x="40" y="64" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">INTERRUPTION / RECOVERY</text>
      <text x="40" y="212" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">PRIMARY PHASES</text>
      <text x="150" y="318" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">RETURN PATHS</text>
      <text x="150" y="420" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">TERMINAL OUTCOMES</text>

      <!-- Recovery callout: reject/discard semantics shared by both return paths. -->
      <text x="272" y="82" fill="#4f5d75" font-size="15" font-style="italic" font-family="'Instrument Serif',serif">Reject or discard cancels the pending version and returns</text>
      <text x="272" y="102" fill="#4f5d75" font-size="15" font-style="italic" font-family="'Instrument Serif',serif">the plan to the phase it was in before submission.</text>

      <!-- Transitions (drawn before states). -->
      <line x1="38" y1="252" x2="64" y2="252" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#dmp-lifecycle-arrow)"/>
      <line x1="214" y1="260" x2="424" y2="260" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#dmp-lifecycle-arrow)"/>
      <path d="M176 224 V128 H876 V224" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#dmp-lifecycle-arrow)"/>
      <line x1="574" y1="260" x2="800" y2="260" stroke="#bf4520" stroke-width="1.4" marker-end="url(#dmp-lifecycle-arrow-accent)"/>
      <path d="M464 296 V328 H140 V296" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#dmp-lifecycle-arrow)"/>
      <path d="M536 296 V348 H836 V296" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#dmp-lifecycle-arrow)"/>
      <path d="M860 296 V372 H500 V296" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#dmp-lifecycle-arrow)"/>
      <path d="M836 224 V192 H916 V224" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#dmp-lifecycle-arrow)"/>
      <path d="M96 296 V436 H424" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#dmp-lifecycle-arrow)"/>
      <path d="M424 460 H40 V280 H64" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#dmp-lifecycle-arrow)"/>

      <!-- Opaque label masks, 6px clear of their strokes. -->
      <g font-family="'Geist Mono',monospace" font-size="7" text-anchor="middle" letter-spacing="0.08em" fill="#4f5d75">
        <rect x="24" y="238" width="32" height="12" rx="2" fill="#f5f5f5"/><text x="40" y="247">NEW</text>
        <rect x="298" y="246" width="42" height="12" rx="2" fill="#f5f5f5"/><text x="319" y="255">SUBMIT·INST</text>
        <rect x="442" y="114" width="52" height="12" rx="2" fill="#f5f5f5"/><text x="468" y="123">FINALIZE·IND</text>
        <rect x="662" y="246" width="50" height="12" rx="2" fill="#f5f5f5"/><text x="687" y="255" fill="#bf4520">APPROVE</text>
        <rect x="276" y="314" width="48" height="12" rx="2" fill="#f5f5f5"/><text x="300" y="323">REJECTED</text>
        <rect x="664" y="334" width="48" height="12" rx="2" fill="#f5f5f5"/><text x="688" y="343">REJECTED</text>
        <rect x="656" y="358" width="44" height="12" rx="2" fill="#f5f5f5"/><text x="678" y="367">REVISION</text>
        <rect x="852" y="178" width="48" height="12" rx="2" fill="#f5f5f5"/><text x="876" y="187">MINOR EDITS</text>
        <rect x="234" y="422" width="44" height="12" rx="2" fill="#f5f5f5"/><text x="256" y="431">ARCHIVE</text>
        <rect x="206" y="446" width="52" height="12" rx="2" fill="#f5f5f5"/><text x="232" y="455">UNARCHIVE</text>
      </g>

      <circle cx="32" cy="252" r="6" fill="#2d3142"/>

      <!-- Primary rail: three phases. -->
      <g font-family="'Geist',sans-serif" text-anchor="middle">
        <g><rect x="64" y="224" width="150" height="72" rx="8" fill="#fff" stroke="#2d3142"/><text x="139" y="255" fill="#2d3142" font-size="12" font-weight="600">Draft</text><text x="139" y="274" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">autosave · revision lock</text></g>
        <g><rect x="424" y="224" width="150" height="72" rx="8" fill="#fff" stroke="#2d3142"/><text x="499" y="255" fill="#2d3142" font-size="12" font-weight="600">Pending</text><text x="499" y="274" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">committee · one at a time</text></g>
        <g><rect x="800" y="224" width="150" height="72" rx="8" fill="rgba(191,69,32,0.08)" stroke="#bf4520"/><circle cx="824" cy="248" r="7" fill="none" stroke="#bf4520"/><circle cx="824" cy="248" r="4" fill="#bf4520"/><text x="882" y="255" fill="#2d3142" font-size="12" font-weight="600">Approved</text><text x="882" y="274" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">in force · tasks generated</text></g>
      </g>

      <!-- Terminal outcome. -->
      <g text-anchor="middle">
        <g><rect x="424" y="416" width="150" height="72" rx="8" fill="rgba(45,49,66,0.04)" stroke="#4f5d75"/><rect x="434" y="426" width="54" height="12" rx="2" fill="none" stroke="rgba(79,93,117,0.45)"/><text x="461" y="435" fill="#4f5d75" font-size="7" font-family="'Geist Mono',monospace">TERMINAL</text><text x="499" y="459" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif">Archived</text><text x="499" y="474" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">preserved · never deleted</text></g>
      </g>

      <!-- Legend: bottom strip. -->
      <g font-family="'Geist Mono',monospace" font-size="8" letter-spacing="0.08em" fill="#4f5d75">
        <line x1="40" y1="532" x2="72" y2="532" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#dmp-lifecycle-arrow)"/>
        <text x="82" y="535">TRANSITION</text>
        <line x1="220" y1="532" x2="252" y2="532" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
        <text x="262" y="535">REVERSIBLE (UNARCHIVE)</text>
        <line x1="470" y1="532" x2="502" y2="532" stroke="#bf4520" stroke-width="1.4" marker-end="url(#dmp-lifecycle-arrow-accent)"/>
        <text x="512" y="535" fill="#bf4520">APPROVE · GENERATES TASKS</text>
        <circle cx="770" cy="532" r="8" fill="none" stroke="#4f5d75"/><circle cx="770" cy="532" r="4" fill="#4f5d75"/>
        <text x="788" y="535">TERMINAL</text>
      </g>
    </svg>
  </div>
</body>
</html>
