<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task lifecycle · State machine</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#bf4520; --font-sans:'Geist',system-ui,sans-serif; --font-serif:'Instrument Serif',serif; --font-mono:'Geist Mono',ui-monospace,monospace; }
    body { font-family:var(--font-sans); background:var(--color-paper); color:var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1200px; width:100%; overflow-x:auto; }
    .eyebrow { font-family:var(--font-mono); font-size:0.66rem; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:0.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem,2.4vw + 0.75rem,2rem); font-weight:400; letter-spacing:-0.02em; line-height:1.15; color:var(--color-ink); margin-bottom:1.5rem; }
    svg { width:100%; min-width:1000px; display:block; }
    svg text { font-family:'Geist',sans-serif; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State · Lifecycle phase map · src/features/tasks</p>
    <h1>Research task lifecycle</h1>

    <svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="task-lifecycle-title task-lifecycle-desc">
      <title id="task-lifecycle-title">Task lifecycle: todo → in_progress → done · cancelled</title>
      <desc id="task-lifecycle-desc">A lifecycle phase map of a research task: Todo, In progress, and Done on the primary rail with an evidence-gated complete transition and reopen returns, and a recoverable Cancelled state restored through reopen offers.</desc>
      <defs>
        <pattern id="task-lifecycle-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
        <marker id="task-lifecycle-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
        <marker id="task-lifecycle-arrow-rev" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0,0 3,8 6" fill="#4f5d75"/></marker>
        <marker id="task-lifecycle-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bf4520"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#task-lifecycle-dots)" opacity="0.55"/>

      <!-- Bands: reopen returns (top), primary phases (middle), cancellation/recovery (bottom). -->
      <rect x="24" y="72" width="952" height="104" rx="8" fill="rgba(79,93,117,0.035)" stroke="rgba(45,49,66,0.12)"/>
      <rect x="24" y="200" width="952" height="120" rx="8" fill="rgba(45,49,66,0.035)" stroke="rgba(45,49,66,0.12)"/>
      <rect x="24" y="408" width="952" height="128" rx="8" fill="rgba(79,93,117,0.035)" stroke="rgba(45,49,66,0.12)"/>
      <text x="40" y="92" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">RETURN PATHS · REOPEN</text>
      <text x="40" y="220" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">PRIMARY PHASES</text>
      <text x="40" y="428" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">CANCELLATION · RECOVERY VIA REOPEN OFFER</text>

      <!-- Callouts: evidence gate + reopen semantics; auto-cancel + offer restore. -->
      <text x="640" y="344" fill="#4f5d75" font-size="15" font-style="italic" font-family="'Instrument Serif',serif">Completion is evidence-gated by stage:</text>
      <text x="640" y="364" fill="#4f5d75" font-size="15" font-style="italic" font-family="'Instrument Serif',serif">declared, file or URL, or repository DOI.</text>
      <text x="640" y="384" fill="#4f5d75" font-size="15" font-style="italic" font-family="'Instrument Serif',serif">Reopening keeps every tick and the evidence.</text>
      <text x="640" y="444" fill="#4f5d75" font-size="15" font-style="italic" font-family="'Instrument Serif',serif">A revision that removes the output cancels</text>
      <text x="640" y="464" fill="#4f5d75" font-size="15" font-style="italic" font-family="'Instrument Serif',serif">its tasks (output_removed); accepting a</text>
      <text x="640" y="484" fill="#4f5d75" font-size="15" font-style="italic" font-family="'Instrument Serif',serif">reopen offer restores the prior status.</text>

      <!-- Transitions (drawn before states). -->
      <line x1="38" y1="252" x2="64" y2="252" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#task-lifecycle-arrow)"/>
      <path d="M108 224 V100 A8 8 0 0 1 116 92 H902 A8 8 0 0 1 910 100 V224" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#task-lifecycle-arrow)"/>
      <path d="M870 224 V128 A8 8 0 0 0 862 120 H147 A8 8 0 0 0 139 128 V224" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#task-lifecycle-arrow)"/>
      <path d="M830 224 V160 A8 8 0 0 0 822 152 H547 A8 8 0 0 0 539 160 V224" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#task-lifecycle-arrow)"/>
      <line x1="214" y1="262" x2="424" y2="262" stroke="#4f5d75" stroke-width="1.2" marker-start="url(#task-lifecycle-arrow-rev)" marker-end="url(#task-lifecycle-arrow)"/>
      <line x1="574" y1="262" x2="800" y2="262" stroke="#bf4520" stroke-width="1.4" marker-end="url(#task-lifecycle-arrow-accent)"/>
      <path d="M89 296 V444 A8 8 0 0 0 97 452 H244" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#task-lifecycle-arrow)"/>
      <path d="M449 296 V444 A8 8 0 0 1 441 452 H394" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#task-lifecycle-arrow)"/>
      <path d="M244 476 H48 A8 8 0 0 1 40 468 V292 A8 8 0 0 1 48 284 H64" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#task-lifecycle-arrow)"/>
      <path d="M394 476 H606 A8 8 0 0 0 614 468 V292 A8 8 0 0 0 606 284 H574" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#task-lifecycle-arrow)"/>

      <!-- Opaque label masks, 6px clear of their strokes. -->
      <g font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle" letter-spacing="0.08em" fill="#4f5d75">
        <rect x="4" y="234" width="60" height="12" fill="#f5f5f5"/><text x="34" y="243">AI + AUTHOR</text>
        <rect x="477" y="74" width="64" height="12" fill="#f5f5f5"/><text x="509" y="83">COMPLETE</text>
        <rect x="464" y="102" width="80" height="12" fill="#f5f5f5"/><text x="504" y="111">REOPEN·CLEAN</text>
        <rect x="642" y="134" width="84" height="12" fill="#f5f5f5"/><text x="684" y="143">REOPEN·TICKED</text>
        <rect x="280" y="244" width="80" height="12" fill="#f5f5f5"/><text x="320" y="253">PATCH STATUS</text>
        <rect x="655" y="244" width="64" height="12" fill="#f5f5f5"/><text x="687" y="253" fill="#bf4520">COMPLETE</text>
        <rect x="97" y="376" width="64" height="12" fill="#f5f5f5"/><text x="129" y="385">CANCEL</text>
        <rect x="457" y="376" width="64" height="12" fill="#f5f5f5"/><text x="489" y="385">CANCEL</text>
        <rect x="102" y="458" width="80" height="12" fill="#f5f5f5"/><text x="142" y="467">ACCEPT·OFFER</text>
        <rect x="464" y="458" width="80" height="12" fill="#f5f5f5"/><text x="504" y="467">ACCEPT·OFFER</text>
      </g>

      <circle cx="32" cy="252" r="6" fill="#2d3142"/>

      <!-- Primary rail: three phases. -->
      <g font-family="'Geist',sans-serif" text-anchor="middle">
        <g><rect x="64" y="224" width="150" height="72" rx="8" fill="#fff" stroke="#2d3142"/><text x="139" y="255" fill="#2d3142" font-size="12" font-weight="600">Todo</text><text x="139" y="274" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">delete only before work</text></g>
        <g><rect x="424" y="224" width="150" height="72" rx="8" fill="#fff" stroke="#2d3142"/><text x="499" y="255" fill="#2d3142" font-size="12" font-weight="600">In progress</text><text x="499" y="274" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">PATCH · done → 409</text></g>
        <g><rect x="800" y="224" width="150" height="72" rx="8" fill="rgba(191,69,32,0.08)" stroke="#bf4520"/><circle cx="824" cy="248" r="7" fill="none" stroke="#bf4520"/><circle cx="824" cy="248" r="4" fill="#bf4520"/><text x="882" y="255" fill="#2d3142" font-size="12" font-weight="600">Done</text><text x="882" y="274" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">stage advances · never back</text></g>
      </g>

      <!-- Cancellation: recoverable, restored via reopen offer. -->
      <g text-anchor="middle">
        <g><rect x="244" y="424" width="150" height="72" rx="8" fill="rgba(45,49,66,0.04)" stroke="#4f5d75"/><rect x="254" y="434" width="64" height="12" rx="2" fill="none" stroke="rgba(79,93,117,0.45)"/><text x="286" y="443" fill="#4f5d75" font-size="7" font-family="'Geist Mono',monospace">RECOVERABLE</text><text x="319" y="467" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif">Cancelled</text><text x="319" y="482" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">manual · output_removed</text></g>
      </g>

      <!-- Legend: bottom strip. -->
      <g font-family="'Geist Mono',monospace" font-size="8" letter-spacing="0.08em" fill="#4f5d75">
        <line x1="40" y1="568" x2="72" y2="568" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#task-lifecycle-arrow)"/>
        <text x="82" y="571">TRANSITION</text>
        <line x1="176" y1="568" x2="208" y2="568" stroke="#4f5d75" stroke-width="1.2" marker-start="url(#task-lifecycle-arrow-rev)" marker-end="url(#task-lifecycle-arrow)"/>
        <text x="218" y="571">PATCH · BOTH WAYS</text>
        <line x1="352" y1="568" x2="384" y2="568" stroke="#bf4520" stroke-width="1.4" marker-end="url(#task-lifecycle-arrow-accent)"/>
        <text x="394" y="571" fill="#bf4520">COMPLETE · EVIDENCE-GATED</text>
        <line x1="568" y1="568" x2="600" y2="568" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
        <text x="610" y="571">REOPEN + OFFER RESTORE</text>
      </g>
    </svg>
  </div>
</body>
</html>
